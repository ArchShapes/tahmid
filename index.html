<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>respawntahmid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923;
    --bg2: #111f2c;
    --panel: #162432;
    --line: #2a3b4b;
    --red: #ff4655;
    --cream: #ece8e1;
    --dim: #8b9aa8;
    --live: #3de08a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100dvh;
    color: var(--cream);
    font-family: "Barlow", "Segoe UI", Arial, sans-serif;
    font-weight: 500;
    line-height: 1.4;
    background:
      linear-gradient(135deg, transparent 0 62%, rgba(255,70,85,0.06) 62% 63%, transparent 63%),
      radial-gradient(60rem 30rem at 15% -10%, #1b2d3f 0%, transparent 70%),
      var(--bg);
  }
  a:focus-visible, iframe:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  .page {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(20rem, 0.9fr);
    grid-template-rows: auto 1fr;
    column-gap: clamp(2rem, 5vw, 4.5rem);
    min-height: 100dvh;
    padding: clamp(1.25rem, 3vw, 2.25rem) clamp(1.25rem, 4vw, 3.5rem) 3rem;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem 1.5rem;
    padding-bottom: 1rem;
    margin-bottom: clamp(1.5rem, 4vw, 3rem);
    border-bottom: 1px solid var(--line);
  }
  .name { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
  .name strong {
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-weight: 800;
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
  }
  .chip {
    padding: 0.2rem 0.7rem;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--red);
    border: 1px solid var(--red);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  }
  .links { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .btn {
    display: inline-block;
    padding: 0.55rem 1.3rem;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--cream);
    background: transparent;
    border: 1px solid var(--line);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn:hover { border-color: var(--cream); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: #ff6471; border-color: #ff6471; }

  main { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding-bottom: 1rem; }
  .status { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 1rem; margin: 0 0 1.25rem; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.3rem 0.9rem;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    border: 1px solid var(--line);
    background: var(--bg2);
  }
  .pill::before { content: ""; width: 0.6rem; height: 0.6rem; background: var(--dim); transform: rotate(45deg); }
  [data-state="live"] .pill { color: var(--live); border-color: var(--live); }
  [data-state="live"] .pill::before { background: var(--live); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .uptime { font-size: 1.05rem; color: var(--dim); }

  .title {
    margin: 0;
    max-width: 20ch;
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 5.6vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  [data-state="offline"] .title, [data-state="unknown"] .title, [data-state="loading"] .title { color: var(--dim); }

  .viewers {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.25rem 0.9rem;
    margin: clamp(2rem, 5vw, 3rem) 0 0;
    padding-left: 1rem;
    border-left: 4px solid var(--red);
  }
  .count {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: clamp(3.4rem, 8vw, 6rem);
    line-height: 1;
    font-variant-numeric: lining-nums;
  }
  .unit {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .chat {
    display: flex;
    flex-direction: column;
    min-height: 30rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--red);
  }
  .chat-head {
    margin: 0;
    padding: 0.7rem 1rem;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }
  .chat-body { position: relative; flex: 1; min-height: 24rem; background: var(--bg2); }
  .chat-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  @media (max-width: 56rem) {
    .page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; }
    main { padding-bottom: 2.5rem; }
    .chat { min-height: 70dvh; }
  }
  @media (prefers-reduced-motion: reduce) { .pill::before { animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="name">
      <strong>respawntahmid</strong>
      <span class="chip">VALORANT</span>
    </div>
    <nav class="links" aria-label="Channels">
      <a class="btn primary" href="https://www.twitch.tv/respawntahmid" target="_blank" rel="noopener">Watch on Twitch</a>
      <a class="btn" href="https://youtube.com/@bachelortahmid" target="_blank" rel="noopener">Blog on YouTube</a>
    </nav>
  </header>

  <main id="stage" data-state="loading">
    <p class="status" role="status" aria-live="polite">
      <span class="pill" id="status-word">Checking</span>
      <span class="uptime" id="uptime"></span>
    </p>
    <h1 class="title" id="title">Loading the stream title</h1>
    <p class="viewers">
      <span class="count" id="count">&mdash;</span>
      <span class="unit">watching</span>
    </p>
  </main>

  <aside class="chat" aria-label="Live chat">
    <h2 class="chat-head">Chat</h2>
    <div class="chat-body">
      <iframe id="chat-frame" title="respawntahmid live chat" loading="lazy" hidden></iframe>
    </div>
  </aside>
</div>

<script>
(() => {
  const CHANNEL = "respawntahmid";
  const POLL_MS = 60000;
  const TIMEOUT_MS = 8000;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const wordEl = $("status-word");
  const uptimeEl = $("uptime");
  const titleEl = $("title");
  const countEl = $("count");

  // Twitch only allows the chat embed on the domain named in `parent`.
  const host = location.hostname;
  if (host) {
    const frame = $("chat-frame");
    frame.src = "https://www.twitch.tv/embed/" + CHANNEL + "/chat?parent=" + encodeURIComponent(host) + "&darkpopout";
    frame.hidden = false;
  }

  // Status, title and viewers come from the public decapi.me Twitch endpoints (no API key).
  function get(path) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    return fetch("https://decapi.me/twitch/" + path + "/" + CHANNEL, { signal: ctrl.signal, cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then((s) => s.trim())
      .finally(() => clearTimeout(timer));
  }

  function setState(state, word, uptime) {
    stage.dataset.state = state;
    wordEl.textContent = word;
    uptimeEl.textContent = uptime || "";
  }

  async function refresh() {
    if (document.hidden) return;
    const [up, vw, ti] = await Promise.allSettled([get("uptime"), get("viewercount"), get("title")]);

    const title = ti.status === "fulfilled" && ti.value && !/not found/i.test(ti.value) ? ti.value : "";
    if (title) titleEl.textContent = title;

    if (up.status !== "fulfilled" || !up.value || /not found/i.test(up.value)) {
      setState("unknown", "Status unavailable");
      countEl.textContent = "\u2014";
      if (!title) titleEl.textContent = "Live details can\u2019t load right now. Open the channel on Twitch.";
      document.title = "respawntahmid";
      return;
    }

    if (/offline/i.test(up.value)) {
      setState("offline", "Offline");
      countEl.textContent = "\u2014";
      if (!title) titleEl.textContent = "Not streaming right now.";
      document.title = "respawntahmid \u2013 Offline";
      return;
    }

    const uptime = /hour|minute/i.test(up.value) ? up.value.replace(/,\s*\d+\s+seconds?$/i, "") : up.value;
    setState("live", "Live", "for " + uptime);

    const n = vw.status === "fulfilled" && /^\d+$/.test(vw.value) ? Number(vw.value) : null;
    countEl.textContent = n === null ? "\u2014" : n.toLocaleString();
    if (!title) titleEl.textContent = "Untitled stream";
    document.title = "\u25CF respawntahmid \u2013 Live";
  }

  refresh();
  setInterval(refresh, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
